<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Message to Parent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1>Send Message to Parent</h1>
        <form action="send_message.php" method="POST">
            <label for="teacher_name">Your Name:</label>
            <input type="text" id="teacher_name" name="teacher_name" placeholder="Enter your name" required><br>

            <label for="parent_email">Parent's Email:</label>
            <input type="email" id="parent_email" name="parent_email" placeholder="Enter parent's email" required><br>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" placeholder="Enter subject" required><br>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea><br>

            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
