<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Sign-Up</title>
    <link rel="stylesheet" href="style.css">
    <img src="logo.png" alt="Website logo" width="200">
</head>
<body>
    <div class="form-container">
        <h1>Parent Sign-Up</h1>
        <form action="parent_reg.php" method="POST">
            

<label for="student_id">Enter your student id:</label>
            <input type="integer" id="student_id" name="student_id" placeholder="Enter your studend admission" required><br>


            <label for="parent_name">Full Name:</label>
            <input type="text" id="parent_name" name="parent_name" placeholder="Enter your full name" required><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required><br>

            <label for="confirm_password">Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Create a password" required><br>

            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
