<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Login - APMS</title>
    <img src="logo.png" alt="Website logo" width="200">
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Logo styling */
        img {
            display: block;
            margin: 0 auto 20px auto; /* Center the logo and add space below */
        }

        /* Login container styling */
        .login-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        /* Heading styling */
        .login-container h1 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Form group styling */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensure padding doesn't affect width */
        }

        /* Button styling */
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #218838;
        }

        /* Register link styling */
        .login-container p {
            margin-top: 10px;
            color: #555;
        }

        .login-container a {
            color: #007bff;
            text-decoration: none;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        /* Error message styling */
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Parent Login</h1>
        <form action="parent_log.php" method="POST">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <p class="parent_reg.html">Don't have an account? <a href="parent_reg.html">Register here</a></p>
    </div>

    <script>
        // Function to validate the form
        function validateForm(event) {
            // Prevent the form from submitting
            event.preventDefault();

            // Get form inputs
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Clear previous error messages
            document.querySelectorAll('.error-message').forEach((el) => el.remove());

            // Validate email
            if (!email) {
                showError('email', 'Email is required.');
                return;
            }

            // Validate password
            if (!password) {
                showError('password', 'Password is required.');
                return;
            }

            // If validation passes, submit the form
            alert('Form submitted successfully!');
            document.querySelector('form').submit();
        }

        // Function to display error messages
        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorMessage = document.createElement('div');
            errorMessage.className = 'error-message';
            errorMessage.textContent = message;
            field.parentNode.insertBefore(errorMessage, field.nextSibling);
        }

        // Attach the validation function to the form's submit event
        document.querySelector('form').addEventListener('submit', validateForm);
    </script>
</body>
</html>
